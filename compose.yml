# Runs Stockroom with a local MongoDB:
#   cp web/.env.example .env   # set AUTH_SECRET
#   docker compose up --build
# Then open http://localhost:3000

services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/stockroom
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (see web/.env.example)}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongodata:
